<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5efe4">
  <title>Fairuz Tarannum & Golam Mohammad Ashiqur Rahman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --ivory: #f6efe7;
      --olive: #687047;
      --ink: #4f4034;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--ivory);
      color: var(--ink);
      font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    }
    body {
      overflow-x: hidden;
    }
    .opening {
      position: fixed;
      inset: 0;
      background: var(--ivory);
      z-index: 100;
      display: grid;
      place-items: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    .opening.done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .stage {
      position: relative;
      width: min(100vw, calc(100dvh * 9 / 16));
      height: min(100dvh, calc(100vw * 16 / 9));
      aspect-ratio: 9 / 16;
      overflow: hidden;
      background: #f6efe7;
      cursor: pointer;
    }
    #inviteVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }
    #sealButton {
      position: absolute;
      z-index: 5;
      left: 50%;
      top: 66.4%;
      width: 44%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border: 0;
      border-radius: 50%;
      background: transparent;
      padding: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: absolute;
      z-index: 6;
      left: 50%;
      bottom: 3.5%;
      transform: translateX(-50%);
      white-space: nowrap;
      color: #5c4a3b;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(11px, 3.2vw, 15px);
      letter-spacing: 0.09em;
      text-transform: uppercase;
      background: rgba(255, 250, 244, 0.8);
      padding: 9px 14px;
      border-radius: 999px;
      backdrop-filter: blur(5px);
      transition: opacity 0.35s ease;
    }
    #hint.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .scroll-site {
      max-width: 680px;
      margin: 0 auto;
      background: var(--ivory);
      position: relative;
      min-height: 100vh;
    }
    .page {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      width: 100%;
    }
    .image-page {
      display: grid;
      place-items: center;
      background: var(--ivory);
    }
    .image-page > img,
    .image-wrap > img,
    .save-wrap > img,
    .venue-wrap > img,
    .final-wrap > img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .image-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .image-wrap > img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .nikah-name-cover {
      position: absolute;
      top: 35%;
      left: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: var(--olive);
      z-index: 2;
      transform: translate(-50%, -50%);
    }
    .script-name {
      font-family: "Great Vibes", "Brush Script MT", cursive;
      font-size: clamp(22px, 3.5vw, 28px);
      line-height: 1.1;
      white-space: normal;
      word-wrap: break-word;
      overflow-wrap: break-word;
      max-width: 100%;
      padding: 0 5px;
      margin: 0;
      color: #4a3a2a;
    }
    .amp {
      font-size: clamp(12px, 2.2vw, 18px);
      line-height: 1;
      margin: 0.05rem 0;
      color: #8a7a6a;
      font-weight: 300;
    }
    .script-name.bride {
      margin-top: 0.02rem;
    }
    .venue-wrap {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .venue-wrap > img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .map-button {
      position: absolute;
      left: 50%;
      bottom: 57.5%;
      transform: translateX(-50%);
      text-decoration: none;
      background: rgba(92, 100, 60, .96);
      color: #fffaf1;
      border: 1px solid rgba(255, 255, 255, .55);
      border-radius: 999px;
      padding: 0.8rem 1.5rem;
      box-shadow: 0 8px 25px rgba(70, 60, 40, .22);
      font-size: clamp(0.8rem, 2.5vw, 1.1rem);
      letter-spacing: .03em;
      transition: transform .2s ease, background .2s ease;
      z-index: 5;
      white-space: nowrap;
    }
    .map-button:active {
      transform: translateX(-50%) scale(.97);
    }
 
    .rsvp-content {
      position: relative;
      z-index: 2;
      width: 100%;
      text-align: center;
    }
    .small-arabic {
      color: var(--olive);
      font-size: 2rem;
      margin-bottom: 1.6rem;
    }
    .eyebrow {
      color: #6c665c;
      font-size: 1rem;
      margin: 0 0 .7rem;
    }
    .rsvp-content h2 {
      margin: 0 0 0.3rem 0;
      color: #625943;
      font-size: clamp(30px, 7vw, 44px);
      font-weight: 600;
    }
    .rsvp-sub {
      max-width: 330px;
      margin: .5rem auto 1.2rem;
      line-height: 1.35;
      color: #71695f;
      font-size: 1.05rem;
    }
    .rsvp-buttons {
      display: grid;
      gap: .7rem;
      justify-items: center;
      position: relative;
      min-height: 120px;
      padding: 5px 0;
    }
    .rsvp-buttons button {
      border-radius: 999px;
      padding: .85rem 1.1rem;
      width: min(92%, 330px);
      border: 1px solid rgba(94, 91, 62, .35);
      box-shadow: 0 8px 22px rgba(80, 65, 40, .1);
      transition: all 0.3s cubic-bezier(.34, 1.56, .64, 1);
      position: relative;
    }
    .accept {
      background: #747b52;
      color: #fffaf0;
      transform-origin: center;
    }
    .accept:hover {
      transform: scale(1.03);
      box-shadow: 0 12px 30px rgba(116, 123, 82, 0.3);
    }
    .decline {
      background: rgba(255, 255, 255, 0.75);
      color: #62594e;
      backdrop-filter: blur(5px);
      position: relative;
      transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1), left 0.8s cubic-bezier(0.23, 1, 0.32, 1), top 0.8s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.4s ease, box-shadow 0.4s ease, background 0.4s ease !important;
      will-change: transform, left, top;
      cursor: default;
      border: 2px solid rgba(180, 160, 140, 0.25) !important;
      box-shadow: 0 8px 22px rgba(80, 65, 40, 0.08) !important;
      z-index: 10;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    .decline::before {
      content: '';
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      opacity: 0.5;
      transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .decline small {
      display: block;
      font-size: .6rem;
      opacity: .6;
      margin-top: .08rem;
      font-style: italic;
      transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .decline.idle {
      animation: gentleFloat 4s ease-in-out infinite;
    }
    @keyframes gentleFloat {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      25% {
        transform: translateY(-4px) rotate(0.3deg);
      }
      75% {
        transform: translateY(4px) rotate(-0.3deg);
      }
    }
    .decline.attracted {
      animation: softSway 3s ease-in-out infinite;
    }
    @keyframes softSway {
      0%, 100% {
        transform: translateY(0px) rotate(0deg) scale(1);
      }
      30% {
        transform: translateY(-3px) rotate(1deg) scale(1.02);
      }
      70% {
        transform: translateY(3px) rotate(-1deg) scale(0.98);
      }
    }
    .decline.dodging {
      animation: gentleDodge 0.8s cubic-bezier(0.23, 1, 0.32, 1) !important;
    }
    @keyframes gentleDodge {
      0% {
        transform: translateY(0) rotate(0deg) scale(1);
      }
      30% {
        transform: translateY(-15px) rotate(-2deg) scale(1.04);
      }
      60% {
        transform: translateY(10px) rotate(2deg) scale(0.96);
      }
      100% {
        transform: translateY(0) rotate(0deg) scale(1);
      }
    }
    .decline::after {
      content: '✨';
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.85rem;
      opacity: 0.3;
      transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .decline:hover::after {
      opacity: 1;
      transform: translateY(-50%) scale(1.2) rotate(360deg);
    }
    .decline:hover::before {
      opacity: 1;
      transform: translateY(-50%) scale(1.2) rotate(-20deg);
    }
    .decline-tease {
      position: absolute;
      top: -38px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: #a88b58;
      opacity: 0;
      transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      white-space: nowrap;
      font-style: italic;
      pointer-events: none;
      background: rgba(255, 250, 245, 0.9);
      padding: 4px 12px;
      border-radius: 12px;
      border: 1px solid rgba(168, 139, 88, 0.2);
      backdrop-filter: blur(4px);
    }
    .decline:hover + .decline-tease,
    .decline:focus + .decline-tease {
      opacity: 0.9;
      transform: translateX(-50%) translateY(-4px);
    }
    .rsvp-success {
      animation: rise .7s ease both;
    }
    .rsvp-success h3 {
      color: #667048;
      font-size: 1.65rem;
      margin: .8rem 0 .35rem;
    }
    .rsvp-success p {
      margin: 0;
      color: #6b6257;
    }
    .success-mark {
      color: #9a8656;
      font-size: 1.6rem;
    }
    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .final-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      background: #f4ecdf;
    }
    .final-wrap > img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
      mix-blend-mode: multiply;
      opacity: .28;
    }
    .photo-overlay img {
      width: 72%;
      max-height: 60%;
      object-fit: contain;
      filter: sepia(.12) saturate(.75) contrast(.92);
    }
    .music-control {
      position: fixed;
      right: 14px;
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 80;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(95, 94, 64, .38);
      background: rgba(250, 247, 240, .82);
      color: #687047;
      backdrop-filter: blur(7px);
      box-shadow: 0 7px 20px rgba(60, 45, 25, .13);
      display: grid;
      place-items: center;
      font-size: 1.25rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .4s ease, transform .2s ease;
    }
    .music-control.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .music-control:active {
      transform: scale(.94);
    }
  </style>
</head>
<body>
<div class="opening" id="opening">
  <div class="stage" id="stage">
    <video id="inviteVideo" playsinline preload="auto" muted poster="assets/poster.png">
      <source src="assets/vidvid.mp4" type="video/mp4">
    </video>
    <button id="sealButton" aria-label="Click the seal to open"></button>
    <div id="hint">Click the seal to open</div>
  </div>
</div>
<div class="scroll-site" id="scrollSite">
  
  <!-- NIKKAH PAGE - SCROLL DOWN BUTTON ONLY HERE -->
  <section class="page image-page nikah-page" id="nikah">
    <div class="image-wrap">
      <img src="assets/nikah.png" alt="Nikkah introduction">
    </div>
    <div class="scroll-down">
      <button onclick="scrollToNextPage(this)">↓ Scroll Down</button>
    </div>
  </section>
  
  <!-- FAMILY PAGE - NO SCROLL DOWN -->
  <section class="page image-page family-page" id="family">
    <img src="assets/family.png" alt="Family invitation with the couple's names and sketch">
  </section>
  
  <!-- SAVE DATE PAGE - NO SCROLL DOWN -->
  <section class="page image-page save-page" id="saveDate">
    <div class="save-wrap">
      <img src="assets/save-date.jpeg" alt="Save the Date — January 9, 2027">
      <div class="date-heart" aria-hidden="true">♡</div>
      
      <!-- RSVP OVERLAY ON TOP OF IMAGE -->
      <div class="rsvp-overlay">
        <div class="small-arabic">بِسْمِ اللَّهِ</div>
        <p class="eyebrow">Your presence would make our day even more special</p>
        <h2>Will you join us?</h2>
        <div class="rsvp-buttons" id="rsvpButtons">
          <button class="accept" id="acceptBtn">Delighted to Accept <span>🤍</span></button>
          <button class="decline" id="declineBtn">Regretfully Unable to Attend <small>(Can not press)</small></button>
        </div>
        <div class="rsvp-success" id="rsvpSuccess" hidden>
          <div class="success-mark">✦</div>
          <h3>We can't wait to celebrate with you</h3>
        </div>
      </div>
    </div>
  </section>

  <!-- VENUE PAGE - NO SCROLL DOWN -->
  <section class="page image-page venue-page" id="venue">
    <div class="venue-wrap">
      <img src="assets/venue.png" alt="Phoenix Convention Center wedding venue">
      <a class="map-button" id="mapLink" href="#" rel="noopener">⌖&nbsp; Get Directions</a>
    </div>
  </section>
  
  <!-- FINAL PAGE - NO SCROLL DOWN -->
  <section class="page image-page final-page" id="final">
    <div class="final-wrap">
      <img src="assets/final.png" alt="Final wedding dua and blessing">
    </div>
  </section>
  
</div>
<button class="music-control" id="music" aria-label="Mute music" title="Mute / unmute music">
  <span id="musicIcon">♪</span>
</button>
<audio id="audio" preload="auto" loop src="assets/music.mp3"></audio>
<script>
const opening = document.getElementById('opening');
const video = document.getElementById('inviteVideo');
const seal = document.getElementById('sealButton');
const hint = document.getElementById('hint');
const stage = document.getElementById('stage');
const audio = document.getElementById('audio');
const musicControl = document.getElementById('music');
const declineBtn = document.getElementById('declineBtn');
const acceptBtn = document.getElementById('acceptBtn');
const rsvpButtons = document.getElementById('rsvpButtons');
const rsvpSuccess = document.getElementById('rsvpSuccess');

let started = false;
let musicStarted = false;
let declineHoverCount = 0;
let isAnimating = false;

// ===============================
// MAP LINK - WORKS ON iOS AND ANDROID
// ===============================

document.getElementById('mapLink').addEventListener('click', function(e) {
  e.preventDefault();
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const lat = 33.4484;
  const lng = -112.0740;
  const place = "Phoenix Convention Center";
  
  if (isIOS) {
    // Try Google Maps app first, fallback to Apple Maps
    const googleMapsApp = `comgooglemaps://?q=${lat},${lng}`;
    const appleMaps = `http://maps.apple.com/?ll=${lat},${lng}&q=${encodeURIComponent(place)}`;
    
    // Try to open Google Maps app
    window.location.href = googleMapsApp;
    
    // If Google Maps app not installed, fallback to Apple Maps after 2 seconds
    setTimeout(() => {
      window.location.href = appleMaps;
    }, 2000);
  } else {
    window.location.href = `https://www.google.com/maps?q=${lat},${lng}`;
  }
});

// ===============================
// SMOOTHER VIDEO OPENING - ONE TAP ONLY
// ===============================

// Prevent multiple taps
let isOpening = false;

function openInvitation() {
  if (isOpening || started) return;
  isOpening = true;
  started = true;
  
  hint.classList.add('hidden');
  seal.style.pointerEvents = 'none';
  
  // Start video
  video.play().catch(() => {});
  
  // Start music with fade
  if (!musicStarted) {
    musicStarted = true;
    audio.volume = 0;
    audio.play().then(() => {
      musicControl.classList.add('visible');
      let volume = 0;
      const fade = setInterval(() => {
        volume += 0.025;
        audio.volume = Math.min(volume, 0.48);
        if (volume >= 0.48) clearInterval(fade);
      }, 70);
    }).catch(() => {});
  }
}

// Click handler for seal
seal.addEventListener('click', openInvitation);
seal.addEventListener('touchstart', (e) => {
  e.preventDefault();
  openInvitation();
}, { passive: false });

// Click handler for stage background
stage.addEventListener('click', (e) => {
  if (e.target === stage || e.target === video) {
    openInvitation();
  }
});

// Fallback for Messenger WebView - click anywhere on stage
stage.addEventListener('touchstart', (e) => {
  if (!started) {
    e.preventDefault();
    openInvitation();
  }
}, { passive: false });

video.addEventListener('ended', () => {
  opening.classList.add('done');
  setTimeout(() => window.scrollTo({ top: 0, behavior: 'instant' }), 0);
});

musicControl.addEventListener('click', () => {
  if (audio.paused) {
    audio.play();
    audio.volume = 0.48;
    document.getElementById('musicIcon').textContent = '♪';
    musicControl.setAttribute('aria-label', 'Mute music');
  } else {
    audio.pause();
    document.getElementById('musicIcon').textContent = '×';
    musicControl.setAttribute('aria-label', 'Play music');
  }
});

// ===============================
// RSVP BUTTON DODGE
// ===============================

const teaseEl = document.createElement('div');
teaseEl.className = 'decline-tease';
teaseEl.textContent = '💕 Come on! Say YES!';
declineBtn.parentNode.insertBefore(teaseEl, declineBtn.nextSibling);

document.addEventListener('mousemove', (event) => {
  if (rsvpButtons.hidden) return;
  const rect = declineBtn.getBoundingClientRect();
  const buttonCenterX = rect.left + rect.width / 2;
  const buttonCenterY = rect.top + rect.height / 2;
  const dx = event.clientX - buttonCenterX;
  const dy = event.clientY - buttonCenterY;
  const distance = Math.sqrt(dx * dx + dy * dy);
  if (distance < 200) {
    const strength = Math.max(0, 1 - (distance / 200));
    const maxOffset = 15;
    const angle = Math.atan2(dy, dx);
    const offsetX = Math.cos(angle) * maxOffset * strength;
    const offsetY = Math.sin(angle) * maxOffset * strength;
    declineBtn.style.transform = `translate(${offsetX}px, ${offsetY}px) rotate(${offsetX * 0.05}deg)`;
    declineBtn.style.transition = 'transform 0.6s cubic-bezier(0.23, 1, 0.32, 1)';
    declineBtn.classList.add('attracted');
    declineBtn.classList.remove('idle');
    if (distance < 100 && declineHoverCount < 3) {
      teaseEl.textContent = '😊 Trying to click me?';
      teaseEl.style.opacity = '0.8';
    } else if (distance < 100 && declineHoverCount < 6) {
      teaseEl.textContent = '😄 Nope! Say YES instead!';
      teaseEl.style.opacity = '0.8';
    } else if (distance < 100 && declineHoverCount < 10) {
      teaseEl.textContent = '😂 You\'re persistent!';
      teaseEl.style.opacity = '0.8';
    }
  } else {
    declineBtn.style.transform = 'translate(0px, 0px) rotate(0deg)';
    declineBtn.classList.remove('attracted');
    declineBtn.classList.add('idle');
    teaseEl.style.opacity = '0';
  }
});

function gentleDodge() {
  if (isAnimating) return;
  isAnimating = true;
  declineHoverCount++;
  const direction = Math.random() > 0.5 ? 1 : -1;
  const dodgeX = direction * (15 + Math.random() * 15);
  const dodgeY = (Math.random() - 0.5) * 30;
  declineBtn.classList.remove('dodging');
  void declineBtn.offsetWidth;
  declineBtn.classList.add('dodging');
  declineBtn.style.transform = `translate(${dodgeX}px, ${dodgeY}px) rotate(${dodgeX * 0.08}deg)`;
  declineBtn.style.transition = 'transform 0.8s cubic-bezier(0.23, 1, 0.32, 1)';
  const smallText = declineBtn.querySelector('small');
  const messages = [
    '🤭 You can\'t catch me!',
    '😄 Nope! Not today!',
    '😂 Keep trying!',
    '✨ Almost there... not!',
    '🤭 You\'re so persistent!',
    '💖 Just say YES already!',
    '😘 I\'m too fast for you!',
    '🎊 Give up and click ACCEPT!'
  ];
  const msgIndex = Math.min(declineHoverCount - 1, messages.length - 1);
  const currentMsg = messages[msgIndex] || messages[messages.length - 1];
  if (smallText) {
    smallText.textContent = currentMsg;
    smallText.style.opacity = '1';
    smallText.style.color = '#a88b58';
    smallText.style.fontSize = '0.7rem';
    smallText.style.transition = 'all 0.6s ease';
  }
  teaseEl.textContent = currentMsg;
  teaseEl.style.opacity = '0.9';
  setTimeout(() => {
    isAnimating = false;
    setTimeout(() => {
      if (!declineBtn.matches(':hover')) {
        declineBtn.style.transform = 'translate(0px, 0px) rotate(0deg)';
        declineBtn.classList.remove('dodging');
        declineBtn.classList.add('idle');
        teaseEl.style.opacity = '0';
      }
    }, 1500);
  }, 800);
}

['pointerdown', 'touchstart', 'click'].forEach((eventName) => {
  declineBtn.addEventListener(eventName, (event) => {
    event.preventDefault();
    event.stopPropagation();
    gentleDodge();
    declineBtn.blur();
  }, { passive: false });
});

let idleInterval = setInterval(() => {
  if (!declineBtn.classList.contains('attracted') && !declineBtn.classList.contains('dodging') && !isAnimating) {
    declineBtn.classList.add('idle');
  }
}, 3000);

acceptBtn.addEventListener('click', () => {
  rsvpButtons.hidden = true;
  rsvpSuccess.hidden = false;
  clearInterval(idleInterval);
});

// ===============================
// SCROLL TO NEXT PAGE
// ===============================

function scrollToNextPage(button) {
  const currentPage = button.closest('.page');
  let nextPage = currentPage.nextElementSibling;
  while (nextPage && !nextPage.classList.contains('page')) {
    nextPage = nextPage.nextElementSibling;
  }
  if (nextPage) {
    nextPage.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}
</script>
